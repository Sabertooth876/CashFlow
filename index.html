function honestyChecks(){const out=[];const tx=state.transactions;if(tx.length<3)return out;const pc=state.primaryCurrency;const today=sod(new Date());const quiet=[];for(let i=1;i<=6;i++){const d=new Date(today);d.setDate(d.getDate()-i);if(!tx.some(t=>t.type==='expense'&&sameDay(pL(t.date),d))&&!(state.zeroDays||[]).includes(isoD(d)))quiet.push(d)}if(quiet.length>=2)out.push({id:'quiet',msg:`${quiet.length} days this week with no spending logged. Real zero, or did something slip?`,detail:`Quiet days: ${quiet.slice().reverse().map(dayLabel).join(', ')}. Nobody is checking but you, so keep it true.`,act2:'They were real zero days',run2:()=>{if(confirm('Only tap OK if you really spent nothing on those days. Riddim only works if you are honest with yourself.')){markZeroDays(quiet.map(isoD));state.toast={msg:'Marked as zero days',type:'ok'};render()}},act:'Add for '+dayLabel(quiet[0]),run:()=>{state.modal={type:'add',form:{type:'expense',amount:'',currency:pc,category:'Food',source:'Salary',note:'',date:isoD(quiet[0]),paymentMethod:'cash'}};render()}});const cashAcct=state.accounts.find(a=>a.type==='cash');const week=7*864e5;if(cashAcct&&Date.now()-(state.lastCashCheck||0)>week)out.push({id:'cash',msg:'When last you count your cash? If your pocket and Riddim do not match, the gap is spending you forgot.',detail:`Riddim thinks ${esc(cashAcct.name)} has ${fmtRaw(acctBalance(cashAcct),pc)}. Count it and see.`,act:'Count my cash',run:()=>{state.modal={type:'reconcile',acct:cashAcct.id};render()}});else if(!cashAcct){const since=new Date(today);since.setDate(since.getDate()-10);const any=tx.some(t=>t.type==='expense'&&(t.paymentMethod||'cash')==='cash');const recent=tx.some(t=>t.type==='expense'&&(t.paymentMethod||'cash')==='cash'&&pL(t.date)>=since);if(any&&!recent)out.push({id:'cashgap',msg:'No cash spending logged in 10 days. Taxi, patty, bag juice: it all counts.',detail:'Small cash is the easiest money to lose track of.',act:'Add cash spending',run:()=>{state.modal={type -btn');hide.textContent='Hide Cashi for today';hide.addEventListener('click',()=>{state.mascotDismissed=Date.now();state.mascotHideUntil=sod(new Date()).getTime()+864e5;closeModal();setTimeout(render,310)});tools.appendChild(hide);sh.appendChild(tools);const gl=el('div','field-label');gl.style.marginTop='18px';gl.textContent='Cashi’s forms';sh.appendChild(gl);const best=Math.max(state.cashiBest||0,streak);const cur=cashiFormIdx(streak);const nx=CASHI_FORMS.find(f=>f.day>streak);const nl=el('div','field-help');nl.style.margin='0 0 8px';nl.textContent=nx?`Next form: ${nx.name} in ${nx.day-streak} day${nx.day-streak===1?'':'s'}. Best streak: ${best} day${best===1?'':'s'}.`:`Every form unlocked. Best streak: ${best} days.`;sh.appendChild(nl);const fg=el('div','form-grid');CASHI_FORMS.forEach((f,i)=>{const t=el('div','form-tile'+(best>=f.day?'':' locked')+(i===cur?' cur':''));t.innerHTML=`${mascotSVG(i===cur?'proud':'happy',i)}<b>${esc(f.name)}</b><span>${best>=f.day?'Day '+f.day:'Locked · day '+f.day}</span>`;fg.appendChild(t)});sh.appendChild(fg);const n=el('div','jar-note');n.style.marginTop='14px';n.textContent='Cashi only looks at what is on this phone. Nothing is sent anywhere.';sh.appendChild(n)}

// ---------- Streak (honest logging) ----------
// A day counts if you logged anything, or told Cashi honestly that you spent nothing.
function loggingStreakInfo(){const days=new Set([...state.transactions.map(t=>t.date),...(state.zeroDays||[])]);const d=sod(new Date());if(!days.has(isoD(d)))d.setDate(d.getDate()-1);let n=0,start=null;while(days.has(isoD(d))&&n<2000){n++;start=isoD(d);d.setDate(d.getDate()-1)}return{n,start}}
function loggingStreak(){return loggingStreakInfo().n}
function markZeroDays(isos){const z=new Set(state.zeroDays||[]);isos.forEach(i=>z.add(i));state.zeroDays=[...z].sort().slice(-400);saveState()}
function todayHasExpense(){const t=todayISO();return state.transactions.some(x=>x.type==='expense'&&x.date===t)}
// ---------- Transformation scene ----------
function cashiEvolve(idx,streak){document.querySelectorAll('.cashi-evolve').forEach(x=>x.remove());const f=CASHI_FORMS[idx];const ov=el('div','cashi-evolve');ov.setAttribute('role','dialog');ov.setAttribute('aria-label',`Cashi transformed into ${f.name}`);ov.innerHTML=`<div class="ce-lines"></div><div class="ce-flash"></div><div class="ce-stage"><div class="ce-old">${mascotSVG('happy',Math.max(0,idx-1))}</div><div class="ce-new">${mascotSVG('proud',idx)}</div></div><div class="ce-kicker">${streak}-day honest streak</div><div class="ce-title">Cashi transformed!</div><div class="ce-name">${esc(f.name)}</div><div class="ce-note">${esc(f.note)}</div><div class="ce-tap">Tap to continue</div>`;const close=()=>{if(!ov.isConnected)return;ov.classList.add('out');setTimeout(()=>ov.remove(),380)};ov.addEventListener('click',close);setTimeout(close,7000);document.body.appendChild(ov)}
// Celebrate once per form per streak run. A new run starts over; forms you reached stay in the gallery.
function checkCashiEvolution(){const st=loggingStreakInfo();const idx=cashiFormIdx(st.n);if(st.n>(state.cashiBest||0)){state.cashiBest=st.n}let seen=state.cashiSeen;let celebrate=-1;if(!seen||seen.start!==st.start){if(idx>0)celebrate=idx;state.cashiSeen={start:st.start,idx}}else if(idx>seen.idx){celebrate=idx;seen.idx=idx}else return;saveState();if(celebrate>0)cashiEvolve(celebrate,st.n)}
// ---------- Money talk ----------
function weekNet(){const t=computeTotals();return t.week.income-t.week.expense}
function cashiLine(kind){const L=MASCOT_MSGS[kind]||MASCOT_MSGS.happy;return L[Math.floor(Math.random()*L.length)]}
// Called on every Home render: reacts to the entry you just saved, otherwise speaks now and then.
function cashiReact(){const n=state.transactions.length;if(state._seenTx==null){state._seenTx=n;return null}if(n<=state._seenTx){state._seenTx=n;return null}const last=state.transactions[n-1];state._seenTx=n;if(last.type==='income'){state.mascotFlash={mood:'excited',until:Date.now()+8000};return cashiLine(cashLevel()==='good'&&Math.random()<0.5?'good':'up')}const sp=safeToSpendInfo();if(cashLevel()==='low'){state.mascotFlash={mood:'worried',until:Date.now()+8000};return cashiLine('low')}if(weekNet()<0||sp.safe<0){state.mascotFlash={mood:'worried',until:Date.now()+8000};return cashiLine('down')}return cashiLine('logged')}
// ---------- Emergency stash ----------
const STASH_KINDS=[['cash','Cash at home'],['bank','Savings account'],['cu','Credit union'],['pardna','Pardna hand'],['fd','Fixed deposit'],['other','Somewhere else']];
function stashState(){if(!state.stash)state.stash={spots:[],months:(state.hurricane&&state.hurricane.months)||3,hurricane:!!(state.hurricane&&Object.keys(state.hurricane.checks||{}).length)};if(!Array.isArray(state.stash.spots))state.stash.spots=[];if(!(state.stash.months>0))state.stash.months=3;return state.stash}
function stashTotal(){const eg=emergencyGoal();return eg?Math.max(0,goalSaved(eg)):0}
function stashPlaced(){return stashState().spots.reduce((s,p)=>s+(Number(p.amount)||0),0)}
function stashTarget(){return Math.round(essentialMonthly().amount*stashState().months)}
function ensureEmergencyGoal(){let eg=emergencyGoal();if(!eg){eg={id:uid(),name:'Emergency fund',target:stashTarget()||0,dueDate:null,created:todayISO(),emergency:true,contribs:[]};state.goals.push(eg)}return eg}
// dir 'add' sets money aside (out of Safe to spend), 'take' frees it, 'place' records where existing stash money is.
function stashMove(spotId,amount,dir){const s=stashState();const sp=s.spots.find(x=>x.id===spotId);amount=Math.round((Number(amount)||0)*100)/100;if(!sp||!(amount>0))return false;const eg=ensureEmergencyGoal();if(dir==='place'){sp.amount=(Number(sp.amount)||0)+amount}else if(dir==='add'){eg.contribs.push({date:todayISO(),amount});sp.amount=(Number(sp.amount)||0)+amount}else{const take=Math.min(amount,Number(sp.amount)||0);if(!(take>0))return false;eg.contribs.push({date:todayISO(),amount:-take});sp.amount=(Number(sp.amount)||0)-take}sp.updated=todayISO();const t=stashTarget();if(t>0&&!(eg.target>0))eg.target=t;saveState();return true}
function stashSpotsLine(pc){return stashState().spots.filter(p=>p.amount>0).sort((a,b)=>b.amount-a.amount).slice(0,3).map(p=>`${esc(p.name)} <b>${fmtRaw(p.amount,pc)}</b>`).join(' · ')}
function goToStash(){state.modal=null;state.view='save';render();setTimeout(()=>{const t=[...document.querySelectorAll('#app .section-label')].find(e=>/^Emergency stash/.test(e.textContent.trim()));if(t)window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-70,behavior:'smooth'})},40)}
function renderStashHome(){const pc=state.primaryCurrency;const s=stashState();const total=stashTotal();const em=essentialMonthly().amount;const target=stashTarget();const c=el('div','stash-card');if(!total&&!s.spots.length){c.innerHTML=`<div class="stash-head"><span class="safe-label">Emergency stash</span></div><div class="safe-sub" style="margin-top:6px">Know exactly how much emergency money you have, and where it is: cash at home, savings, credit union.</div><div class="pardna-actions" style="margin-top:12px"><button class="pa-btn primary" data-a="add">Start my stash</button></div>`}else{const pct=target>0?Math.min(100,total/target*100):0;const months=em>0?total/em:0;const un=Math.round((total-stashPlaced())*100)/100;const hs=hurricaneState();c.innerHTML=`<div class="stash-head"><span class="safe-label">Emergency stash</span><button class="section-link" data-a="open">Open</button></div><div class="stash-val">${fmtRaw(total,pc)}</div><div class="safe-sub">${em>0?`Covers about <b>${months.toFixed(1)} months</b> of essentials${target>0?` · goal ${fmtRaw(target,pc)}`:''}`:'Log a few essential bills so Riddim can work out your goal.'}</div>${target>0?`<div class="mini-track"><div class="mini-fill ${pct>=100?'ok':''}" style="width:${pct}%"></div></div>`:''}<div class="stash-spots">${(()=>{const ln=stashSpotsLine(pc);if(!ln)return un>1?`<span style="color:var(--warn)">${fmtRaw(un,pc)} not placed yet. Tap Open and say where you keep it.</span>`:'Not placed anywhere yet.';return ln+(un>1?` · <span style="color:var(--warn)">not placed ${fmtRaw(un,pc)}</span>`:'')})()}</div>${s.hurricane&&isHurricaneSeason()?`<button class="stash-hz" data-a="open">Hurricane prep: ${HURRICANE_CHECKS.filter(([k])=>hs.checks[k]).length} of ${HURRICANE_CHECKS.length} done</button>`:''}<div class="pardna-actions" style="margin-top:12px"><button class="pa-btn primary" data-a="add">Add to stash</button><button class="pa-btn" data-a="take">Take out</button></div>`}c.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.a;if(a==='open')goToStash();else{state.modal={type:'stash',dir:a==='take'?'take':'add'};render()}}));app.appendChild(c)}
function renderStashSection(){const pc=state.primaryCurrency;const s=stashState();const l=el('div','section-label');l.innerHTML='<span>Emergency stash</span>';const ab=el('button','section-link');ab.textContent='+ Add money';ab.addEventListener('click',()=>{state.modal={type:'stash',dir:'add'};render()});l.appendChild(ab);app.appendChild(l);const total=stashTotal();const em=essentialMonthly();const target=stashTarget();const un=Math.round((total-stashPlaced())*100)/100;const c=el('div','chart-card');c.innerHTML=`<div style="font-size:12px;color:var(--text-dim)">Emergency money you have</div><div class="jar-big">${fmtRaw(total,pc)}</div><div class="jar-row"><span>Essentials a month</span><span>${fmtRaw(em.amount,pc)}</span></div><div class="jar-row"><span>Covers</span><span>${em.amount>0?(total/em.amount).toFixed(1)+' months':'Not worked out yet'}</span></div><div class="jar-row"><span>Goal</span><span>${fmtRaw(target,pc)}</span></div><div class="seg" id="st-m" style="margin:10px 0"></div><div class="inv-meta" style="margin:8px 0 4px">Where it is</div><div id="st-spots"></div>${un>1?`<div class="calc-flag" style="margin-top:8px">${fmtRaw(un,pc)} is not placed yet. Say where it is, so you can grab it fast in an emergency.</div>`:''}<div class="pardna-actions" style="margin-top:12px"><button class="pa-btn primary" data-a="add">Add money</button><button class="pa-btn" data-a="take">Take out</button><button class="pa-btn" data-a="place">${un>1?'Place it':'+ New place'}</button></div><label class="check-row" style="margin-top:14px"><input type="checkbox" id="st-hz" ${s.hurricane?'checked':''}><span>Show hurricane season prep (checklist, survival budget, insurance check)</span></label><div class="jar-note">Stash money stays in your balance but is left out of Safe to spend. Pick what counts as essential with the Essentials button.</div>`;const ms=c.querySelector('#st-m');[1,3,6,9].forEach(m=>{const b=el('button','chip'+(s.months===m?' selected':''));b.textContent=`${m} mo`;b.addEventListener('click',()=>{s.months=m;const eg=emergencyGoal();if(eg)eg.target=stashTarget();saveState();render()});ms.appendChild(b)});const sl=c.querySelector('#st-spots');if(!s.spots.length){const e=el('div','field-help');e.style.margin='0 0 4px';e.textContent='No places yet. Add one: cash at home, NCB savings, credit union...';sl.appendChild(e)}s.spots.forEach(p=>{const r=el('div','cat-row');const kind=(STASH_KINDS.find(k=>k[0]===p.kind)||['','Other'])[1];r.innerHTML=`<span class="cat-name">${esc(p.name)}<span style="color:var(--text-dim);font-size:12px"> · ${esc(kind)}</span></span><span style="font-family:var(--font-mono);font-size:13px">${fmtRaw(p.amount||0,pc)}</span><button class="cat-btn" data-k="ren">Rename</button><button class="cat-btn" data-k="del">Remove</button>`;r.querySelector('[data-k=ren]').addEventListener('click',()=>{const v=prompt('Rename this place:',p.name);if(v&&v.trim()){p.name=v.trim();saveState();render()}});r.querySelector('[data-k=del]').addEventListener('click',()=>{if((Number(p.amount)||0)>0){alert('Take the money out or move it to another place first.');return}if(!confirm(`Remove "${p.name}"?`))return;s.spots=s.spots.filter(x=>x.id!==p.id);saveState();render()});sl.appendChild(r)});c.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{state.modal={type:'stash',dir:b.dataset.a};render()}));c.querySelector('#st-hz').addEventListener('change',e=>{s.hurricane=e.target.checked;saveState();render()});app.appendChild(c);if(s.hurricane){renderHurricaneCard(true);renderInsuranceCard()}}
function renderStashSheet(sh){const pc=state.primaryCurrency;const s=stashState();const dir=state.modal.dir||'add';const total=stashTotal();const un=Math.max(0,Math.round((total-stashPlaced())*100)/100);const f=state.modal.form||(state.modal.form={spot:(s.spots[0]&&s.spots[0].id)||'new',name:'',kind:'cash',amount:dir==='place'&&un>0?String(un):''});sheetHead(sh,dir==='take'?'Take out of stash':dir==='place'?'Where is your stash?':'Add to stash');const help=el('div');help.style.cssText='color:var(--text-dim);font-size:13px;margin-bottom:14px;line-height:1.5';help.textContent=dir==='take'?'Money you take out goes back into Safe to spend. Use it when an emergency really comes.':dir==='place'?'Record where your emergency money is kept, so you know where to go when you need it.':'Set money aside for emergencies and say where you keep it. It stays in your balance but leaves Safe to spend.';sh.appendChild(help);const ps=el('div','seg');s.spots.forEach(p=>{const b=el('button','chip'+(f.spot===p.id?' selected':''));b.textContent=`${p.name}${dir==='take'?' · '+fmtRaw(p.amount||0,pc):''}`;b.addEventListener('click',()=>{f.spot=p.id;render()});ps.appendChild(b)});if(dir!=='take'){const nb=el('button','chip'+(f.spot==='new'?' selected':''));nb.textContent='+ New place';nb.addEventListener('click',()=>{f.spot='new';render()});ps.appendChild(nb)}sh.appendChild(ps);sh.appendChild(spc(10));if(f.spot==='new'&&dir!=='take'){const ks=el('div','seg');STASH_KINDS.forEach(([k,l])=>{const b=el('button','chip'+(f.kind===k?' selected':''));b.textContent=l;b.addEventListener('click',()=>{f.kind=k;render()});ks.appendChild(b)});sh.appendChild(ks);const nf=el('div','field');nf.style.marginTop='10px';nf.innerHTML=`<label class="field-label">Name this place</label><input class="input" type="text" placeholder="e.g. Safe in the bedroom, NCB savings, COK credit union" value="${esc(f.name)}">`;nf.querySelector('input').addEventListener('input',e=>{f.name=e.target.value});sh.appendChild(nf)}if(dir==='take'&&!s.spots.length){const e=el('div','field-help');e.textContent='Nothing placed yet.';sh.appendChild(e);return}const af=el('div','field');af.innerHTML=`<label class="field-label">${dir==='place'?'Amount kept here (optional)':'Amount'}</label><div class="amount-input"><span class="currency-sym">${sym(pc)}</span><input type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${esc(f.amount)}"></div>${dir==='place'&&un>0?`<div class="field-help">${fmtRaw(un,pc)} of your stash is not placed yet.</div>`:''}`;af.querySelector('input').addEventListener('input',e=>{f.amount=e.target.value});sh.appendChild(af);const sb=el('button','btn-primary');sb.textContent=dir==='take'?'Take out':dir==='place'?'Save place':'Add to stash';sb.addEventListener('click',()=>{let id=f.spot;if(id==='new'){const nm=(f.name||'').trim()||(STASH_KINDS.find(k=>k[0]===f.kind)||['','My stash'])[1];id=uid();s.spots.push({id,name:nm,kind:f.kind,amount:0,updated:todayISO()})}const amt=parseFloat(f.amount)||0;if(dir==='place'){if(amt>un+0.01){alert(`Only ${fmtRaw(un,pc)} of your stash is not placed yet. Use Add to stash for new money.`);return}if(amt>0)stashMove(id,amt,'place');else saveState()}else{if(!(amt>0)){alert('Enter an amount.');return}if(!stashMove(id,amt,dir)){alert('That place does not have that much.');return}}state.toast={msg:dir==='take'?'Taken out of your stash':dir==='place'?'Place saved':'Added to your stash',type:'ok'};state.balancePulse=true;closeModal();setTimeout(render,310)});sh.appendChild(sb)}
// Earl's money-level lines: how much is free right now, measured against your essentials.
function cashLevel(){const sp=safeToSpendInfo();const em=essentialMonthly().amount;if(sp.safe<=0)return 'low';if(em>0){if(sp.safe<em*0.5)return 'low';if(sp.safe>=em)return 'good'}return null}

if(!state.essentials||!state.essentials.length)state.essentials=[...ESSENTIAL_DEFAULT];applyPrivacy();if(getLock())showLock();
